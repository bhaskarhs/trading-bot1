name: NSE market session

# GitHub's schedule: trigger is best-effort (this repo was ~5h late on 11–16 Sep).
# A single 03:40 UTC cron is not a 09:15 IST alarm. We fire every 15 minutes
# during the cash window (Asia/Kolkata) so a delayed tick still starts a session.
# Only one run trades at a time (concurrency). Extra ticks no-op after the close.
#
# Split into two jobs because a free GitHub-hosted job may run at most 6 hours,
# while 09:15–15:30 IST is longer than that.

on:
  schedule:
    - cron: "10 9 * * 1-5"
      timezone: Asia/Kolkata
    - cron: "0,15,30,45 9-15 * * 1-5"
      timezone: Asia/Kolkata
  workflow_dispatch:
  repository_dispatch:
    types: [nse-session]

concurrency:
  group: nse-session
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  RUN_MARKET_SESSION: "1"
  PAPER_TRADING: "true"
  ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
  ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
  ANGEL_MPIN: ${{ secrets.ANGEL_MPIN }}
  ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  gate:
    name: Pick slice (IST)
    runs-on: ubuntu-latest
    outputs:
      run_morning: ${{ steps.phase.outputs.run_morning }}
      run_afternoon: ${{ steps.phase.outputs.run_afternoon }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytz
      - id: phase
        run: python .github/scripts/gha_session_gate.py

  morning:
    name: 09:15–12:15 IST
    runs-on: ubuntu-latest
    timeout-minutes: 200
    needs: gate
    if: needs.gate.outputs.run_morning == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Require Angel secrets
        run: |
          if [ -z "$ANGEL_API_KEY" ] || [ -z "$ANGEL_TOTP_SECRET" ]; then
            echo "Add ANGEL_API_KEY, ANGEL_CLIENT_ID, ANGEL_MPIN, ANGEL_TOTP_SECRET under Settings → Secrets and variables → Actions"
            exit 1
          fi
      - run: pip install -r requirements.txt
      - name: Run until 12:15 IST
        env:
          SESSION_END: "12:15"
        run: python bot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ledger
          path: |
            paper_trades.json
            open_positions.json
          if-no-files-found: warn

  afternoon:
    name: 12:15–15:30 IST
    runs-on: ubuntu-latest
    timeout-minutes: 210
    needs: [gate, morning]
    if: |
      always() &&
      needs.gate.outputs.run_afternoon == 'true' &&
      (needs.morning.result == 'success' || needs.morning.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.morning.result == 'success'
        continue-on-error: true
        with:
          name: ledger
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run until 15:30 IST (square-off 15:15)
        env:
          SESSION_END: "15:30"
        run: python bot.py
      - name: Daily report
        if: always()
        run: python daily_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ledger-eod
          path: |
            paper_trades.json
            open_positions.json
            reports/
          if-no-files-found: warn
      - name: Commit ledger and daily reports back to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper_trades.json open_positions.json reports/
          if git diff --staged --quiet; then
            echo "No ledger or report changes"
            exit 0
          fi
          git commit -m "bot ledger and daily report $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}" || git pull --rebase origin master
          git push
